<!DOCTYPE html>
<html lang="de-DE">
  <head>
    <meta charset="UTF-8">
    <title>Der musikalische Turing-Test</title>
    <!-- JSpsych core and plugins -->
    <script src="https://unpkg.com/jspsych@8.2.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-audio-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-likert@2.1.0"></script>

    <!-- Styling  -->
    <link href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        height: 80%;
        margin: 0;
        font-family: "Lato", sans-serif;
        background-color: #F3EFE8;
        color: #333333;
      }

      .jspsych {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
      }

      .jspsych-content {
        font-family: "Lato", sans-serif;
        font-size: 2.5em;
        text-align: center;
        padding: 1em;
        <!-- box-sizing: border-box; -->
      }
    </style>
  </head>
  <body>
    <script>
      // SETUP
      // --- Initialize jsPsych ---
      var timestamp = new Date().toISOString().replace(/[:.]/g, "-");

      var jsPsych = initJsPsych({
        on_finish: function() {
          // debug output
          console.table(
            jsPsych.data.get()
              .filter({ trial_type: 'audio-keyboard-response' })
              .select(['stimulus', 'response', 'correct', 'participant_id', 'rt'])
              .values()
          );
        }
      });

      // --- Audio files ---
      var audio_files = [];

      var human_files = [
        "data/H/122.6-4.wav",
        "data/H/148.6-6.wav",
        "data/H/153.5-3.wav",
        "data/H/175.5-5.wav",
        "data/H/227.11-5.wav",
        "data/H/244.15-6.wav",
        "data/H/256-5.wav",
        "data/H/276-8.wav",
        "data/H/283-7.wav",
        "data/H/290-2.wav",
        "data/H/292-2.wav",
        // "data/H/294-4.wav",
        // "data/H/325-5.wav",
        // "data/H/368-7.wav",
        // "data/H/375-1.wav",
        // "data/H/402-8.wav",
        // "data/H/426-6.wav",
        // "data/H/428-3.wav",
        // "data/H/5.7-2.wav",
        // "data/H/65.7-5.wav",
        // "data/H/90.5-6.wav",
      ];
      human_files.forEach(f => audio_files.push({file: f, label: "m"}));

      var ai_files = [
        "data/A/output10-6.wav",
        "data/A/output14-6.wav",
        "data/A/output48-2.wav",
        "data/A/output16-1.wav",
        "data/A/output19-1.wav",
        "data/A/output21-1.wav",
        "data/A/output26-4.wav",
        "data/A/output28-2.wav",
        "data/A/output3-3.wav",
        "data/A/output31-5.wav",
        "data/A/output39-6.wav",
        // "data/A/output58-3.wav",
        // "data/A/output61-3.wav",
        // "data/A/output64-3.wav",
        // "data/A/output67-3.wav",
        // "data/A/output70-1.wav",
        // "data/A/output75-1.wav",
        // "data/A/output77-3.wav",
        // "data/A/output79-3.wav",
        // "data/A/output80-2.wav",
        // "data/A/output81-3.wav",
      ];
      ai_files.forEach(f => audio_files.push({file: f, label: "x"}));

      // Shuffle
      var shuffled_files = jsPsych.randomization.shuffle(audio_files);

      var human_pool = shuffled_files.filter(f => f.label === "m");
      var ai_pool = shuffled_files.filter(f => f.label === "x");

      const training_human = jsPsych.randomization.sampleWithoutReplacement(human_pool, 1)[0];
      const training_ai = jsPsych.randomization.sampleWithoutReplacement(ai_pool, 1)[0];

      const training_trials = jsPsych.randomization.shuffle([training_human, training_ai]);
      shuffled_files = shuffled_files.filter(f => f !== training_human && f !== training_ai);

      // EXPERIMENT

      var timeline = [];

      // 1. Welcome Screen
      var title = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `<h1>Der musikalische Turing-Test</h1>
            <img src="ai-composer.png" style="height:400px">
            <p>Drücke eine beliebige Taste.</p>`
      };
      timeline.push(title);

      // Participant info 
      var survey1 = {
        type: jsPsychSurveyText,
        questions: [
          {prompt: "Wie alt bist du?", name: "age"},
        ],
        button_label: "Weiter",
      };
      timeline.push(survey1);

      var survey2 = {
        type: jsPsychSurveyLikert,
        questions: [
          {
            prompt: "Wie würdest du deine musikalische Erfahrung einschätzen?",
            labels: ["sehr unerfahren", "unerfahren", "erfahren", "sehr erfahren"]
          }
        ],
        button_label: "Weiter"
      };
      timeline.push(survey2);

      var survey3 = {
        type: jsPsychSurveyLikert,
        questions: [
          {prompt: "Spielst du ein Instrument?", labels: ["ja", "nein"]},
          {prompt: "Singst du im Chor?", labels: ["ja", "nein"]},
          {prompt: "Nutzt du KI mehrmals pro Woche?", labels: ["ja", "nein"]},
        ],
        button_label: "Weiter"
      };
      timeline.push(survey3);

      var survey4 = {
        type: jsPsychSurveyLikert,
        questions: [
          {
            prompt: "Wie sicher bist du, dass du KI-Musik von echter Musik unterscheiden kannst?",
            labels: ["sehr unsicher", "unsicher", "sicher", "sehr unsicher"]
          }
        ],
        button_label: "Weiter"
      };
      timeline.push(survey4);

      // 2. Instructions
      var instructions = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <h2>Willkommen bei unserem Experiment!</h2>
          <p>Du wird ein paar kurze Musikschnipsel mit Cembaloklang hören.</p>
          <p>Wenn du glaubst, dass es von einem <strong>Menschen</strong> komponiert wurde, drücke <strong>M</strong>.</p>
          <p>Wenn du glaubst, dass es von einer <strong>Künstlichen Intelligenz</strong> generiert wurde, drücke <strong>X</strong>.</p>
          <p>Antworte möglichst spontan, ohne viel nachzudenken.</p>
          <hr>
          <p>Zuerst kommt ein kurzer Test, um das Experiment kennenzulernen.</p>
          <p>Drücke die LEERTASTE, um fortzufahren.</p>`,
        // choices = [" "],
        post_trial_gap: 500,
      };
      timeline.push(instructions);

      // 3. Survey information 
      // age, status (student, dozent), selbsteinschätzung (1--100), 
      // instrument? chor? (wie lange)

      // 4. Training phase
      var training_feedback = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function() {
          const last_trial = jsPsych.data.get().last(1).values()[0];

          if (last_trial.correct_response) {
            return `<h2 style='color:green;'>Richtig!</h2>
              <p>Jetzt weißt du, wie es funktioniert.</p>
              <p>Drücke die LEERTASTE, um fortzufahren.</p>`;
          } else {
            return `<h2 style='color:red;'>Leider nicht korrekt.</h2>
              <p>Aber jetzt weißt du, wie es funktioniert.</p>
              <p>Drücke die LEERTASTE, um fortzufahren.</p>`;
          };
        },
        choices: [" "],
        post_trial_gap: 500
      };

      training_trials.forEach(trial_info => {
        timeline.push({
          type: jsPsychAudioKeyboardResponse, 
          stimulus: trial_info.file, 
          choices: ["x", "m"],
          prompt: `<h2>Testphase</h2>
          <p>Wurde dies von einem Menschen (<strong>M</strong>) oder einer KI (<strong>X</strong>) komponiert?</p>
            <p>🧑‍🦰 ❔ 💻</p>`,
          data: { correct: trial_info.label, training: true },
          on_finish: function(data) {
            data.correct_response = data.response?.toLowerCase() === data.correct;
            console.log(data.response, trial_info.label);
          }
        });
        timeline.push(training_feedback);
      });

      // 5. Audio trials
      for (let i = 0; i < shuffled_files.length; i++) {
        let trial_info = shuffled_files[i];
        timeline.push({
          type: jsPsychAudioKeyboardResponse,
          stimulus: trial_info.file,
          choices: ["x","m"],
          prompt: `
          <p>Wurde dies von einem Menschen (<strong>M</strong>) oder einer KI (<strong>X</strong>) komponiert?</p>
            <p>🧑‍🦰 ❔ 💻</p>
            <p style="margin-top:10px; font-weight:bold;">Versuch ${i+1} von ${shuffled_files.length}</p>`,
          data: function() {
            return {
              correct: trial_info.label,
              timestamp: timestamp,
              training: false
            };
          },
          response_ends_trial: true,
          post_trial_gap: 500,
        });
      }

      // 6. Free feedback
      var free_text_screen = {
        type: jsPsychSurveyText,
        questions: [
          {
            prompt: `<h2>Bevor wir zum Ergebnis kommen...</h2>
              <p>Wie fandest du die Aufgabe? Hast du Feedback für uns?</p>`,
            placeholder: "Deine Antwort…",
            rows: 5,
            columns: 80
          }
        ],
        button_label: "Weiter",
        data: {
          trial_type: "free_text"
        },
      };
      timeline.push(free_text_screen);


      var difficulty = {
        type: jsPsychSurveyLikert,
        questions: [
          {
            prompt: "Wie schwer fandest du das Experiment?",
            labels: ["sehr einfach", "einfach", "schwer", "sehr schwer"]
          }
        ],
        button_label: "Weiter"
      };
      timeline.push(difficulty);


      var survey_final = {
        type: jsPsychSurveyLikert,
        questions: [
          {
            prompt: "Wie sicher bist du, dass du KI-Musik von echter Musik unterscheiden kannst?",
            labels: ["sehr unsicher", "unsicher", "sicher", "sehr sicher"]
          }
        ],
        button_label: "Weiter"
      };
      timeline.push(survey_final);

      // 6. Final screen
      var final_screen = {
        type: jsPsychHtmlKeyboardResponse,
        choices: ["§"],
        stimulus: function() {

          const trials = jsPsych.data.get()
            .filter({ trial_type: 'audio-keyboard-response', training: false })
            .values();

          const total = trials.length;

          // Confusion matrix counts
          const mm = trials.filter(t => t.correct === "m" && t.response?.toLowerCase() === "m").length;
          const mx = trials.filter(t => t.correct === "m" && t.response?.toLowerCase() === "x").length;
          const xm = trials.filter(t => t.correct === "x" && t.response?.toLowerCase() === "m").length;
          const xx = trials.filter(t => t.correct === "x" && t.response?.toLowerCase() === "x").length;

          const correct = mm + xx;
          const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;

          return `
            <h2>Vielen Dank für die Teilnahme!</h2>

            <p><strong>Deine Trefferquote:</strong> ${correct} / ${total} (${accuracy}%)</p>

            <table style="
              margin: 20px auto;
              border-collapse: collapse;
              font-size: 0.9em;
              min-width: 420px;
            ">
              <tr>
                <th style="border: 1px solid #999; padding: 10px;"></th>
                <th style="border: 1px solid #999; padding: 10px;"></th>
                <th colspan="2" style="border: 1px solid #999; padding: 10px;">
                  Deine Antwort
                </th>
              </tr>
              <tr>
                <th style="border: 1px solid #999; padding: 10px;"></th>
                <th style="border: 1px solid #999; padding: 10px;"></th>
                <th style="border: 1px solid #999; padding: 10px;">🧑‍🦰 Mensch</th>
                <th style="border: 1px solid #999; padding: 10px;">💻 KI</th>
              </tr>
              <tr>
                <!-- NEW left-side spanning header -->
                <th rowspan="2" style="
                  border: 1px solid #999;
                  padding: 10px;
                  writing-mode: vertical-rl;
                  transform: rotate(180deg);
                  text-align: center;
                ">
                  Korrekte Antwort
                </th>

                <th style="border: 1px solid #999; padding: 10px;">🧑‍🦰 Mensch</th>
                <td style="border: 1px solid #999; padding: 10px; background:#d4edda;">
                  ${mm}
                </td>
                <td style="border: 1px solid #999; padding: 10px; background:#f8d7da;">
                  ${mx}
                </td>
              </tr>
              <tr>
                <th style="border: 1px solid #999; padding: 10px;">💻 KI</th>
                <td style="border: 1px solid #999; padding: 10px; background:#f8d7da;">
                  ${xm}
                </td>
                <td style="border: 1px solid #999; padding: 10px; background:#d4edda;">
                  ${xx}
                </td>
              </tr>
            </table>
            <p>Bitte sage Bescheid, dass du fertig bist.</p>
          `;
        },

        on_finish: function() {
          const csv = jsPsych.data.get()
            .filterCustom(trial =>
              ['audio-keyboard-response', 'survey-text'].includes(trial.trial_type))
            // .filter({ trial_type: 'audio-keyboard-response' })
            .csv();

          const blob = new Blob([csv], { type: "text/csv" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `results_${timestamp}.csv`;
          a.click();
          URL.revokeObjectURL(url);
        }
      };
       timeline.push(final_screen);

      // 7. Setup and run experiment
      jsPsych.run(timeline);
    </script>
  </body>
</html>
